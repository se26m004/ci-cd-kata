name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Level 2: Linting läuft VOR den Tests – schlägt er fehl, bricht die Pipeline ab
      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      # Level 3: Produktionsdateien bauen und als ZIP-Artifact hochladen
      - name: Build production files
        run: npm run build

      - name: Create ZIP archive
        run: cd dist && zip -r ../ci-cd-kata.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-cd-kata-build
          path: ci-cd-kata.zip